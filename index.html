<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="site-header">
    <h1 class="site-title">Habits<br><em>Tracker</em></h1>
    <!-- <div class="site-tagline">track · streak · improve</div> -->
  </header>

  <!-- SUMMARY -->
  <section class="summary" id="summary-section" aria-label="Summary">
    <div class="summary-card">
      <span class="val" id="sum-total">0</span>
      <span class="label">Total Habits</span>
    </div>
    <div class="summary-card">
      <span class="val" id="sum-done">0</span>
      <span class="label">Done Today</span>
    </div>
    <div class="summary-card pct">
      <span class="val" id="sum-pct">0%</span>
      <span class="label">Complete</span>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>
  </section>

  <!-- ADD FORM -->
  <section class="form-section">
    <h2 class="form-title">Add a new habit</h2>
    <form id="habit-form" novalidate>
      <div class="form-grid">
        <div class="field">
          <label for="habit-name">Habit name</label>
          <input type="text" id="habit-name" placeholder="e.g. Read 20 pages" autocomplete="off">
        </div>
        <div class="field">
          <label for="habit-target">Days / week</label>
          <input type="number" id="habit-target" placeholder="1–7" min="1" max="7">
        </div>
        <div class="field">
          <label for="habit-category">Category</label>
          <select id="habit-category">
            <option value="">— select —</option>
            <option value="health">Health</option>
            <option value="learning">Learning</option>
            <option value="fitness">Fitness</option>
            <option value="mindfulness">Mindfulness</option>
            <option value="productivity">Productivity</option>
          </select>
        </div>
      </div>
      <span class="form-error" id="form-error" role="alert"></span>
      <div class="form-bottom">
        <div></div>
        <button type="submit" class="btn-add">+ Add Habit</button>
      </div>
    </form>
  </section>

  <!-- FILTER BAR -->
  <div class="filter-bar" id="filter-bar" role="group" aria-label="Filter by category">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="health">Health</button>
    <button class="filter-btn" data-filter="learning">Learning</button>
    <button class="filter-btn" data-filter="fitness">Fitness</button>
    <button class="filter-btn" data-filter="mindfulness">Mindfulness</button>
    <button class="filter-btn" data-filter="productivity">Productivity</button>
  </div>

  <!-- HABITS LIST -->
  <section>
    <div class="section-heading">
      <h2>Your Habits</h2>
      <span class="habit-count" id="habit-count"></span>
    </div>
    <div id="habits-container"></div>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
